<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de CPF</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        input {
            padding: 8px;
            font-size: 16px;
            width: 200px;
            text-align: center;
        }
        button {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #resultado {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Validador de CPF</h2>
    <p>Digite um CPF válido (somente números):</p>

    <input type="text" id="cpf" maxlength="11" placeholder="Ex: 12345678909">
    <br><br>
    <button onclick="validarCPF()">Validar</button>

    <h3 id="resultado"></h3>

    <script>
        function validarCPF() {
            let cpf = document.getElementById("cpf").value;
            let resultado = document.getElementById("resultado");

            cpf = cpf.replace(/\D/g, '');

            if (cpf.length !== 11) {
                resultado.innerText = "CPF inválido! Deve conter 11 números.";
                resultado.style.color = "red";
                return;
            }

            if (/^(\d)\1{10}$/.test(cpf)) {
                resultado.innerText = "CPF inválido! Números repetidos não são permitidos.";
                resultado.style.color = "red";
                return;
            }

            let soma = 0;
            let resto;

            for (let i = 1; i <= 9; i++) {
                soma += parseInt(cpf[i - 1]) * (11 - i);
            }
            resto = (soma * 10) % 11;
            if (resto === 10 || resto === 11) resto = 0;
            if (resto !== parseInt(cpf[9])) {
                resultado.innerText = "CPF inválido!";
                resultado.style.color = "red";
                return;
            }

            soma = 0;
            for (let i = 1; i <= 10; i++) {
                soma += parseInt(cpf[i - 1]) * (12 - i);
            }
            resto = (soma * 10) % 11;
            if (resto === 10 || resto === 11) resto = 0;
            if (resto !== parseInt(cpf[10])) {
                resultado.innerText = "CPF inválido!";
                resultado.style.color = "red";
                return;
            }

            resultado.innerText = "CPF válido!";
            resultado.style.color = "green";
        }
    </script>

</body>
</html>
