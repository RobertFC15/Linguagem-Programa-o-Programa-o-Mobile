<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada do 1 ao 10</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .tabuada {
            background-color: #f1f1f1;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            width: 150px;
        }
    </style>
</head>
<body>

    <h2>Tabuada do 1 ao 10</h2>
    <div class="container" id="tabuadaContainer"></div>

    <script>
        function gerarTabuada() {
            let container = document.getElementById("tabuadaContainer");
            container.innerHTML = ""

            for (let i = 1; i <= 10; i++) {
                let tabela = document.createElement("div");
                tabela.classList.add("tabuada");
                tabela.innerHTML = `<h3>Tabuada do ${i}</h3>`;

                for (let j = 1; j <= 10; j++) {
                    let resultado = i * j;
                    tabela.innerHTML += `${i} × ${j} = ${resultado}<br>`;
                }

                container.appendChild(tabela);
            }
        }

        gerarTabuada();
    </script>

</body>
</html>
