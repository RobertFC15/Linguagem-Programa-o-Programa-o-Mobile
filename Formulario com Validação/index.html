<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        form {
            max-width: 300px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input {
            padding: 8px;
            font-size: 16px;
        }
        button {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #mensagemErro {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
        #resultado {
            margin-top: 20px;
            font-size: 18px;
            background-color: #f1f1f1;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h2>Cadastro de Produto</h2>

    <form id="produtoForm">
        <input type="text" id="nome" placeholder="Nome do Produto">
        <span id="mensagemErro"></span>
        
        <input type="number" id="quantidade" placeholder="Quantidade">
        <input type="number" id="valor" placeholder="Valor (R$)" step="0.01">
        
        <button type="button" onclick="cadastrarProduto()">Cadastrar</button>
    </form>

    <h3 id="resultado"></h3>

    <script>
        function cadastrarProduto() {
            let nome = document.getElementById("nome").value.trim();
            let quantidade = document.getElementById("quantidade").value;
            let valor = document.getElementById("valor").value;
            let mensagemErro = document.getElementById("mensagemErro");
            let resultado = document.getElementById("resultado");

            if (nome === "") {
                mensagemErro.innerText = "O nome do produto é obrigatório!";
                return;
            } else {
                mensagemErro.innerText = "";
            }

            let produto = {
                nome: nome,
                quantidade: parseInt(quantidade),
                valor: parseFloat(valor),
                total: parseInt(quantidade) * parseFloat(valor)
            };

            resultado.innerHTML = `
                <strong>Produto Cadastrado:</strong> <br>
                Nome: ${produto.nome} <br>
                Quantidade: ${produto.quantidade} <br>
                Valor Unitário: R$ ${produto.valor.toFixed(2)} <br>
                Valor Total: R$ ${produto.total.toFixed(2)}
            `;
        }
    </script>

</body>
</html>
